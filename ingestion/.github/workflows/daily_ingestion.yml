name: Daily Tier 1 Ingestion

on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST daily
  workflow_dispatch: {}     # allows manual "Run workflow" from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r ingestion/requirements.txt

      - name: Run ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INDIANAPI_KEY: ${{ secrets.INDIANAPI_KEY }}
        run: python ingestion/run_pipeline.py
